ito que me dé una fecha de pago hoy. Llámeme o mándeme mensaje al {lot} y lo anoto. Responda STOP para no recibir mensajes."},{id:"m3",stage:"10–19 days",title:"Late fee + arrangement offer",en:"{first}, this is {collector} at Let 'Em Ride Autos. You're {dpd} days behind. Interest is adding up every single day on this contract, so the longer it sits the more it costs you. If you can't pay the full {amt}, call me at {lot} — we may be able to set up an arrangement. I'd rather work it out with you.",es:"{first}, le habla {collector} de Let 'Em Ride Autos. Tiene {dpd} días de atraso. El interés se acumula todos los días en este contrato, así que entre más tiempo pase, más le cuesta. Si no puede pagar los {amt} completos, llámeme al {lot} — tal vez podamos hacer un arreglo. Prefiero resolverlo con usted."},{id:"m4",stage:"20–29 days",title:"Before default action",en:"{first} — {collector} at Let 'Em Ride Autos. Your account is {dpd} days past due and moving toward default. Your written notice went out by certified mail. Please call me at {lot} today so we can keep you in the {vehicle}. Payoff on the account today is {payoff}.",es:"{first} — le habla {collector} de Let 'Em Ride Autos. Su cuenta tiene {dpd} días de atraso y va camino al incumplimiento. Su aviso por escrito se envió por correo certificado. Por favor llámeme hoy al {lot} para que pueda quedarse con el {vehicle}. El pago total de la cuenta hoy es {payoff}."},{id:"m5",stage:"30+ SKIP",title:"Skip / locate — last contact attempt",en:"{first}, this is {collector} at Let 'Em Ride Autos. We have not been able to reach you and your account is {dpd} days past due. Your certified notice was mailed and the cure date is {cure}. Call me at {lot} today. If you can't keep the vehicle, we can arrange a voluntary surrender — that is usually better for you than the alternative.",es:"{first}, le habla {collector} de Let 'Em Ride Autos. No hemos podido comunicarnos con usted y su cuenta tiene {dpd} días de atraso. Su aviso certificado ya fue enviado y la fecha límite para ponerse al corriente es {cure}. Llámeme hoy al {lot}. Si no puede quedarse con el vehículo, podemos hacer una entrega voluntaria — normalmente eso le conviene más."},{id:"m6",stage:"Any",title:"Promise confirmation",needsPromise:!0,en:"{first}, confirming what we agreed: {pamt} on {pdate}. I've written it down under your name. If anything changes, call me first at {lot} — don't just let the date pass. Thank you. — {collector}, Let 'Em Ride Autos",es:"{first}, le confirmo lo que acordamos: {pamt} el {pdate}. Ya lo anoté a su nombre. Si algo cambia, llámeme primero al {lot} — no deje pasar la fecha. Gracias. — {collector}, Let 'Em Ride Autos"},{id:"m7",stage:"Any",title:"Broken promise",needsPromise:!0,en:"{first}, we had {pamt} set for {pdate} and it didn't come in. I need to hear from you today at {lot}. Tell me what happened and what you can do — I can't help you if you don't pick up. — {collector}",es:"{first}, teníamos {pamt} programado para el {pdate} y no entró. Necesito saber de usted hoy al {lot}. Dígame qué pasó y qué puede hacer — no puedo ayudarle si no contesta. — {collector}"},{id:"m8",stage:"30+",title:"Voluntary surrender offer",en:"{first}, this is {collector} at Let 'Em Ride Autos. If the payments have gotten away from you, you can bring the {vehicle} back to us voluntarily. Call me at {lot} and I'll walk you through exactly how it works and what it means for your balance. It's a conversation, not a fight.",es:"{first}, le habla {collector} de Let 'Em Ride Autos. Si los pagos se le complicaron, puede entregarnos el {vehicle} voluntariamente. Llámeme al {lot} y le explico exactamente cómo funciona y qué pasa con su saldo. Es una conversación, no un pleito."},{id:"m9",stage:"Any",title:"Payment received",needsPromise:!0,en:"Thank you {first} — we received {pamt} today. Your next payment of {amt} is due {due}. Appreciate you. — {collector}, Let 'Em Ride Autos",es:"Gracias {first} — recibimos {pamt} hoy. Su próximo pago de {amt} vence el {due}. Se lo agradezco. — {collector}, Let 'Em Ride Autos"},{id:"m10",stage:"Any",title:"Extension / deferral approved",needsPromise:!0,en:"{first}, your extension is approved. Your next due date moves to {due} and the amount stays {amt}. Interest still accrues daily during the extension, so your payoff goes up — but you're current on the schedule. Sign the extension form before {pdate}. — {collector}",es:"{first}, su extensión fue aprobada. Su próxima fecha de pago cambia al {due} y la cantidad sigue siendo {amt}. El interés se sigue acumulando diariamente durante la extensión, así que su pago total sube — pero queda al corriente con el calendario. Firme la forma de extensión antes del {pdate}. — {collector}"}],Ip=[{id:"c1",title:"Early call (1–9 days)",stage:"1–9 days",en:`1. "May I speak with {first}? This is {collector} calling from Let 'Em Ride Autos."
2. Confirm you have the right party. Do not discuss the account with anyone else.
3. "I'm calling about the {vehicle}. Your {amt} payment was due {due} and it hasn't come in yet."
4. STOP TALKING. Let them answer.
5. Probe: "What happened this pay period?" / "When do you get paid next?"
6. Close for a date: "So you'll pay {amt} on ____ — online, by phone, or at the lot?"
7. Read it back, then log the promise and set your next contact date.`,es:`1. "¿Me comunica con {first}? Le habla {collector} de Let 'Em Ride Autos."
2. Confirme que es la persona correcta. No hable de la cuenta con nadie más.
3. "Le llamo por el {vehicle}. Su pago de {amt} venció el {due} y todavía no ha entrado."
4. DEJE DE HABLAR. Deje que conteste.
5. Pregunte: "¿Qué pasó este período?" / "¿Cuándo le pagan otra vez?"
6. Cierre con una fecha: "Entonces va a pagar {amt} el ____ — ¿en línea, por teléfono, o en el lote?"
7. Repítalo, luego anote la promesa y ponga su próxima fecha de contacto.`},{id:"c2",title:"Broken promise call",stage:"Any",en:`1. "{first}, it's {collector} at Let 'Em Ride. We had {pamt} set for {pdate}."
2. "It didn't come in. Tell me what happened." — then be quiet.
3. Do not re-negotiate down on the first ask. "What can you put down today?"
4. If they can pay part: take the money now, set the balance date before their next due date.
5. If they can't: "I have to write something down. What date are you telling me?"
6. Second broken promise = supervisor review before you grant a third.
7. Log it. A broken promise moves them to the top of the board tomorrow.`,es:`1. "{first}, le habla {collector} de Let 'Em Ride. Teníamos {pamt} para el {pdate}."
2. "No entró. Dígame qué pasó." — luego quédese callada.
3. No baje la cantidad en la primera petición. "¿Cuánto puede abonar hoy?"
4. Si puede pagar una parte: tome el dinero ahora y ponga fecha para el resto antes de su próximo pago.
5. Si no puede: "Tengo que anotar algo. ¿Qué fecha me está dando?"
6. Segunda promesa rota = revisión con el supervisor antes de dar una tercera.
7. Anótelo. Una promesa rota lo sube a lo más alto de la lista mañana.`},{id:"c3",title:"30+ skip / locate",stage:"30+ SKIP",en:`Before calling: ping GPS, note last known location and time.
1. Call mobile, then work, then references — references only to ask for updated contact info. Never disclose the debt to a third party.
2. If you reach them: "{first}, I've been trying to reach you for {dpd} days. Your certified notice went out and the cure date is {cure}."
3. Give two doors: "Either we get you caught up, or we set up a voluntary surrender. Which one are we doing?"
4. If no contact after 3 attempts across 3 days: document all attempts, confirm certified notice + tracking, escalate for recovery assignment.
5. Never threaten arrest, never threaten anything you won't do, never call before 8am or after 9pm.`,es:`Antes de llamar: revise el GPS, anote la última ubicación conocida y la hora.
1. Llame al celular, luego al trabajo, luego a las referencias — a las referencias SOLO para pedir información de contacto actualizada. Nunca revele la deuda a terceros.
2. Si contesta: "{first}, llevo {dpd} días tratando de localizarlo. Su aviso certificado ya salió y la fecha límite es {cure}."
3. Dé dos opciones: "O lo ponemos al corriente, o hacemos una entrega voluntaria. ¿Cuál va a ser?"
4. Si no hay contacto después de 3 intentos en 3 días: documente todos los intentos, confirme el aviso certificado y el número de rastreo, y escale para asignar la recuperación.
5. Nunca amenace con arresto, nunca amenace con algo que no va a hacer, nunca llame antes de las 8am ni después de las 9pm.`},{id:"c4",title:"Voluntary surrender conversation",stage:"30+",en:`1. "{first}, I'm not calling to fight with you. I'm calling to give you a way out."
2. Explain plainly: bring the {vehicle} to the lot, we inspect it, you sign the surrender form, you take your personal property with you.
3. Be honest about the balance: the vehicle sells, the sale proceeds go against what you owe, and there may be a remaining balance. Do not promise the balance goes away.
4. Set a date, time, and address. Write it on the account.
5. Remind them to bring both keys, sort out the plates, and empty the trunk.
6. Log surrender scheduled + tell the lot so someone is there to receive it.`,es:`1. "{first}, no le llamo para pelear. Le llamo para darle una salida."
2. Explique claro: trae el {vehicle} al lote, lo inspeccionamos, firma la forma de entrega, y se lleva sus pertenencias.
3. Sea honesta con el saldo: el vehículo se vende, lo que se obtenga se aplica a lo que debe, y puede quedar un saldo. No prometa que la deuda desaparece.
