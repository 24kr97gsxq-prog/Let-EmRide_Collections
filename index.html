collector}, Let 'Em Ride Autos",es:"{first}, le confirmo lo que acordamos: {pamt} el {pdate}. Ya lo anoté a su nombre. Si algo cambia, llámeme primero al {lot} — no deje pasar la fecha. Gracias. — {collector}, Let 'Em Ride Autos"},{id:"m7",stage:"Any",title:"Broken promise",needsPromise:!0,en:"{first}, we had {pamt} set for {pdate} and it didn't come in. I need to hear from you today at {lot}. Tell me what happened and what you can do — I can't help you if you don't pick up. — {collector}",es:"{first}, teníamos {pamt} programado para el {pdate} y no entró. Necesito saber de usted hoy al {lot}. Dígame qué pasó y qué puede hacer — no puedo ayudarle si no contesta. — {collector}"},{id:"m8",stage:"30+",title:"Voluntary surrender offer",en:"{first}, this is {collector} at Let 'Em Ride Autos. If the payments have gotten away from you, you can bring the {vehicle} back to us voluntarily. Call me at {lot} and I'll walk you through exactly how it works and what it means for your balance. It's a conversation, not a fight.",es:"{first}, le habla {collector} de Let 'Em Ride Autos. Si los pagos se le complicaron, puede entregarnos el {vehicle} voluntariamente. Llámeme al {lot} y le explico exactamente cómo funciona y qué pasa con su saldo. Es una conversación, no un pleito."},{id:"m9",stage:"Any",title:"Payment received",needsPromise:!0,en:"Thank you {first} — we received {pamt} today. Your next payment of {amt} is due {due}. Appreciate you. — {collector}, Let 'Em Ride Autos",es:"Gracias {first} — recibimos {pamt} hoy. Su próximo pago de {amt} vence el {due}. Se lo agradezco. — {collector}, Let 'Em Ride Autos"},{id:"m10",stage:"Any",title:"Extension / deferral approved",needsPromise:!0,en:"{first}, your extension is approved. Your next due date moves to {due} and the amount stays {amt}. Interest still accrues daily during the extension, so your payoff goes up — but you're current on the schedule. Sign the extension form before {pdate}. — {collector}",es:"{first}, su extensión fue aprobada. Su próxima fecha de pago cambia al {due} y la cantidad sigue siendo {amt}. El interés se sigue acumulando diariamente durante la extensión, así que su pago total sube — pero queda al corriente con el calendario. Firme la forma de extensión antes del {pdate}. — {collector}"}],Cp=[{id:"c1",title:"Early call (1–9 days)",stage:"1–9 days",en:`1. "May I speak with {first}? This is {collector} calling from Let 'Em Ride Autos."

7. Repítalo, luego anote la promesa y ponga su próxima fecha de contacto.`},{id:"c2",title:"Broken promise call",stage:"Any",en:`1. "{first}, it's {collector} at Let 'Em Ride. We had {pamt} set for {pdate}."
